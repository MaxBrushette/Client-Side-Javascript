<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>PokeAPI</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="css/normalize.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <script src="js/javascript.js" defer></script>
    </head>
    <body>
        <main>
            <h1>Test</h1>
            <form>
                <label for="pokeName">Any Pokemon Name</label>
                <textarea id="pokeName" placeholder="Name"></textarea> <br>
                <label for="pokeDex">Any Pokedex Number</label>
                <textarea id="pokeDex" placeholder="PokeDex Number"></textarea>
                <button type="submit"></button>
            </form>
            <div id="card">
                <p>Dex Number</p>
                <h2>Pokemon Name</h2>
                <img id="pokeImg" src="" alt="Pokemon"/>
            </div>
        </main>
    </body>
</html>
